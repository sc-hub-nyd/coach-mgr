<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoachMgr デザインシステム更新</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .slide-container { width: 1280px; min-height: 712px; background: #fdf3f4; color: #2a1719; display: grid; grid-template-columns: 1.43fr 0.57fr; }
    .main { padding: 74px 72px 40px 88px; display: flex; flex-direction: column; justify-content: space-between; }
    .eyebrow { color: #c72c38; font: 700 16px/1.2 Arial, 'Noto Sans JP', sans-serif; letter-spacing: 0.18em; }
    h1 { margin: 20px 0 22px; color: #5a1018; font: 800 58px/1.16 Arial, 'Noto Sans JP', sans-serif; letter-spacing: -0.04em; }
    .subtitle { max-width: 690px; color: #64474b; font: 400 24px/1.6 Arial, 'Noto Sans JP', sans-serif; }
    .meta { display: flex; gap: 14px; align-items: center; color: #72555a; font: 700 16px/1.2 Arial, 'Noto Sans JP', sans-serif; }
    .line { width: 60px; height: 3px; background: #c72c38; }
    .brand { background: #5a1018; padding: 56px 48px; display: flex; flex-direction: column; justify-content: space-between; }
    .brand-mark { width: 160px; height: 160px; object-fit: contain; filter: brightness(0) invert(1); }
    .brand-label { color: #ffffff; font: 700 18px/1.4 Arial, 'Noto Sans JP', sans-serif; letter-spacing: 0.06em; }
    .brand-rule { width: 100%; height: 1px; background: rgba(255,255,255,.35); }
    .brand-note { color: #f1d9dc; font: 400 15px/1.65 Arial, 'Noto Sans JP', sans-serif; }
  </style>
</head>
<body>
  <div class="slide-container">
    <section class="main">
      <div>
        <div class="eyebrow">COACHMGR / DESIGN SYSTEM</div>
        <h1>任意色・表示モード・<br>ブランドアイコンを<br>ひとつの運用へ</h1>
        <p class="subtitle">動的チームテーマと既定チームアイコンを統合した、CoachMgr v1.20.0のデザインシステム更新。</p>
      </div>
      <div class="meta"><span class="line"></span><span>2026.08.18&nbsp;&nbsp;｜&nbsp;&nbsp;設計・実装・検証報告</span></div>
    </section>
    <aside class="brand">
      <img class="brand-mark" src="/home/ubuntu/coach-mgr-css/v119-design-system-update-slides/assets/team-signal.svg" alt="既定チーム チームシグナル">
      <div>
        <div class="brand-rule"></div>
        <p class="brand-label" style="margin:18px 0 8px;">TEAM_AGNOSTIC FC<br>ICON SYSTEM</p>
        <p class="brand-note">Default seed #EF3340<br>CurrentColor / light / dark / PWA</p>
      </div>
    </aside>
  </div>
</body>
</html>
