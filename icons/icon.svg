<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Rich Matte Obsidian -->
    <radialGradient id="glassBgGrad" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Under-glass Glowing Accent Gradients -->
    <radialGradient id="glowRed" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ef3340" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#ef3340" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ef3340" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowGreen" cx="70%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldVector" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Frosted Glass Edge Highlight (Multi-stop Sharp White Border) -->
    <linearGradient id="frostedBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="redGlassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b5a"/>
      <stop offset="50%" stop-color="#ef3340"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Glass Surface Fill -->
    <linearGradient id="glassSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Sharp Drop Shadows -->
    <filter id="glassPlateShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <filter id="vectorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect width="512" height="512" rx="115" fill="url(#glassBgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="114" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2"/>

  <!-- Layer 1: Under-Glass Vibrant Ambient Lighting (Brand Red & Emerald) -->
  <circle cx="170" cy="180" r="140" fill="url(#glowRed)"/>
  <circle cx="340" cy="330" r="150" fill="url(#glowGreen)"/>
  <circle cx="256" cy="256" r="80" fill="#facc15" opacity="0.15"/>

  <!-- Layer 2: Outer Red Shield Contour Accent -->
  <path d="M 256,60 L 415,95 L 415,225 C 415,335 320,425 256,458 C 192,425 97,335 97,225 L 97,95 Z" 
        fill="none" 
        stroke="url(#redGlassBorder)" 
        stroke-width="5" 
        stroke-linejoin="round"
        opacity="0.95"
        filter="url(#vectorGlow)"/>

  <!-- Layer 3: Main Frosted Glass Shield Plate (Floating Multi-Layer) -->
  <g filter="url(#glassPlateShadow)">
    <path d="M 256,76 L 398,107 L 398,225 C 398,322 314,402 256,432 C 198,402 114,322 114,225 L 114,107 Z" 
          fill="url(#glassSurface)" 
          stroke="url(#frostedBorder)" 
          stroke-width="2.5" 
          stroke-linejoin="round"/>
  </g>

  <!-- Layer 4: Tactical Pitch Markings (Etched Inside Glass) -->
  <g stroke="rgba(255, 255, 255, 0.45)" stroke-width="2" fill="none">
    <!-- Pitch Outer Rectangle Inside Shield -->
    <rect x="156" y="125" width="200" height="260" rx="4" stroke="rgba(255, 255, 255, 0.35)"/>
    
    <!-- Halfway Line & Center Circle -->
    <line x1="156" y1="255" x2="356" y2="255" stroke="rgba(255, 255, 255, 0.5)"/>
    <circle cx="256" cy="255" r="42" stroke="rgba(255, 255, 255, 0.5)"/>

    <!-- Top Penalty Area & Goal Area -->
    <rect x="200" y="125" width="112" height="42"/>
    <rect x="224" y="125" width="64" height="18"/>
    <path d="M 230,167 A 28,28 0 0,0 282,167"/>

    <!-- Bottom Penalty Area & Goal Area -->
    <rect x="200" y="343" width="112" height="42"/>
    <rect x="224" y="367" width="64" height="18"/>
    <path d="M 230,343 A 28,28 0 0,1 282,343"/>
  </g>

  <!-- Layer 5: Dynamic Gold Tactical Vectors & Playmaker Curves (On Top of Glass) -->
  <g filter="url(#vectorGlow)">
    <!-- Right Upward Attacking Curve (Gold) -->
    <path d="M 195,310 C 210,340 315,350 345,260 C 360,215 330,160 300,145" 
          fill="none" 
          stroke="url(#goldVector)" 
          stroke-width="5" 
          stroke-linecap="round"/>
    <polygon points="292,138 314,142 304,160" fill="#facc15"/>

    <!-- Left Tactical Support Pass (Emerald Line) -->
    <path d="M 165,160 C 145,220 170,270 200,280" 
          fill="none" 
          stroke="#34d399" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-dasharray="6 6"/>
  </g>

  <!-- Layer 6: Center Soccer Ball (Geometric Frosted Emblem) -->
  <g transform="translate(256, 255)" filter="url(#glassPlateShadow)">
    <!-- Ball Shield Plate Base -->
    <circle cx="0" cy="0" r="54" fill="rgba(15, 23, 42, 0.85)" stroke="url(#frostedBorder)" stroke-width="2.5"/>
    
    <!-- Ball Center Pentagon (Pitch Emerald) -->
    <polygon points="0,-18 17,-5 11,15 -11,15 -17,-5" fill="#10b981"/>
    <polygon points="0,-18 17,-5 11,15 -11,15 -17,-5" fill="none" stroke="#ffffff" stroke-width="2"/>

    <!-- Seam Lines -->
    <line x1="0" y1="-18" x2="0" y2="-38" stroke="#ffffff" stroke-width="2"/>
    <line x1="17" y1="-5" x2="36" y2="-13" stroke="#ffffff" stroke-width="2"/>
    <line x1="11" y1="15" x2="24" y2="34" stroke="#ffffff" stroke-width="2"/>
    <line x1="-11" y1="15" x2="-24" y2="34" stroke="#ffffff" stroke-width="2"/>
    <line x1="-17" y1="-5" x2="-36" y2="-13" stroke="#ffffff" stroke-width="2"/>

    <!-- Outer Pentagons (Brand Red) -->
    <polygon points="0,-52 14,-40 -14,-40" fill="#ef3340"/>
    <polygon points="50,-16 36,-13 43,-31" fill="#ef3340"/>
    <polygon points="34,41 24,34 42,22" fill="#ef3340"/>
    <polygon points="-34,41 -24,34 -42,22" fill="#ef3340"/>
    <polygon points="-50,-16 -36,-13 -43,-31" fill="#ef3340"/>

    <!-- Top-Left Glass Reflection -->
    <ellipse cx="-16" cy="-18" rx="20" ry="11" fill="#ffffff" opacity="0.32" transform="rotate(-30 -16 -18)"/>
  </g>

  <!-- Player Node Position Dots (Gold & Red) -->
  <circle cx="195" cy="310" r="5.5" fill="#facc15" filter="url(#vectorGlow)"/>
  <circle cx="165" cy="160" r="5" fill="#ef3340" filter="url(#vectorGlow)"/>
  <circle cx="300" cy="145" r="5" fill="#34d399" filter="url(#vectorGlow)"/>
</svg>
